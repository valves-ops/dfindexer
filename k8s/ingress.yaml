apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dfindexer
spec:
  ingressClassName: traefik
  rules:
  - host: dfindexer.k3s.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dfindexer
            port:
              name: http
